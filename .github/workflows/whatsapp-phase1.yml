name: WhatsApp Phase 1 isolated rehearsal
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: whatsapp_phase1_test_rehearsal
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsx --test server/whatsappOrderPhase1.integration.ts server/whatsappWawiAdapter.integration.ts server/pepgptOffers.test.ts server/botPromoPolicy.test.ts server/kwkCheckoutPricing.test.ts server/jarvyOrderContract.test.ts server/orderConfirmationPolicy.test.ts server/orderItemIdentity.test.ts
        env:
          WOP_TEST_DB_USER: postgres
